<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetHaven - Premium Pet Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
      
      :root {
        --color-accent: #059669; /* Emerald 600 */
        --color-dark: #1C1917;    /* Stone 900 */
        --color-light: #FAFAF9;   /* Stone 50 */
      }

      body { 
        font-family: 'Outfit', sans-serif; 
        background-color: var(--color-light);
        color: var(--color-dark);
        overflow-x: hidden;
        cursor: none; /* Hide default cursor */
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif; 
        letter-spacing: -0.02em;
      }
      
      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      /* Noise Texture Overlay */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 40;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Custom Cursor */
      .cursor-dot,
      .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 9999;
        pointer-events: none;
      }
      .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: var(--color-dark);
      }
      .cursor-outline {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(28, 25, 23, 0.5);
        transition: width 0.2s, height 0.2s, background-color 0.2s, border-color 0.2s;
      }
      body:hover .cursor-outline.hovered {
        width: 80px;
        height: 80px;
        background-color: rgba(5, 150, 105, 0.1); /* Emerald tint */
        border-color: transparent;
        backdrop-filter: blur(2px);
      }

      /* Marquee Animation */
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        position: relative;
      }
      .marquee-content {
        display: inline-block;
        animation: marquee 30s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* Hide Scrollbar but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Premium Glass */
      .glass-nav {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
      }

      /* Outline Text */
      .text-outline {
        -webkit-text-stroke: 1px rgba(28, 25, 23, 0.1);
        color: transparent;
      }
      .text-outline-dark {
         -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
         color: transparent;
      }

      /* Animations */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes reveal {
        0% { opacity: 0; transform: translateY(30px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      .animate-float { animation: float 6s ease-in-out infinite; }
      
      .reveal {
        opacity: 0;
        animation: reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-500 { animation-delay: 500ms; }

      /* Gradient Mesh */
      .mesh-gradient {
        background-color: #FAFAF9;
        background-image: 
          radial-gradient(at 0% 0%, hsla(156, 68%, 88%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(38, 88%, 88%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 100%, hsla(168, 64%, 86%, 0.4) 0px, transparent 50%),
          radial-gradient(at 0% 100%, hsla(28, 77%, 88%, 0.4) 0px, transparent 50%);
      }

      .input-premium {
        @apply w-full bg-white/50 border border-stone-200 rounded-2xl px-6 py-4 outline-none transition-all duration-300 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500;
      }
      
      .btn-premium {
        @apply px-8 py-4 rounded-full font-bold transition-all duration-300 active:scale-95 shadow-lg shadow-emerald-900/5 hover:shadow-emerald-900/10;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div class="bg-noise"></div>
  </body>
</html>
